<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>আমার স্থায়ী ডিজিটাল খাতা</title>
    
    <!-- PWA Manifest ও থিম কালার -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.ibb.co/0RCv1GJK/1000110395.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background-color: #e2e8f0; 
            user-select: none; 
        }
        .note-page {
            background-color: #ffffff;
            min-height: 80vh;
            border: none;
            outline: none;
            resize: none;
            font-size: 22px;
            line-height: 1.5; 
            color: #000000 !important;
            font-weight: 700;
            letter-spacing: 0.5px;
            -webkit-font-smoothing: antialiased;
            white-space: pre-wrap; 
            user-select: text; 
        }
        .note-card {
            transition: all 0.2s ease;
        }
        .note-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col">

    <!-- প্রিমিয়াম হেডার বার -->
    <header class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white py-3.5 px-4 shadow-md sticky top-0 z-10 flex justify-between items-center border-b border-indigo-900">
        <div class="flex items-center gap-2.5">
            <button onclick="goHome()" class="text-indigo-200 hover:text-white text-lg font-bold px-1 transition">⬅️</button>
            <h1 id="pageTitle" class="text-lg font-bold truncate max-w-[170px] tracking-wide text-slate-100">স্থায়ী খাতা</h1>
        </div>
        <div class="flex items-center gap-2">
            <span id="headerTotalBadge" class="hidden bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-full font-bold shadow-sm">মোট: ৳০</span>
            <span id="saveStatus" class="text-[11px] text-emerald-400 font-bold"></span>
            <button onclick="goHome()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-3.5 py-1.5 rounded-full font-bold shadow transition">✓ সম্পন্ন</button>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col">

        <!-- হোম ভিউ: নোট লিস্ট -->
        <div id="homeView" class="space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="text-sm font-bold text-slate-800">📖 আপনার খাতার পাতাগুলো</h2>
                    <p class="text-[11px] text-slate-400">অফলাইন ও আজীবন স্থায়ী সেভ</p>
                </div>
                <button onclick="createNewNote()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3.5 py-2.5 rounded-xl font-bold shadow-md transition flex items-center gap-1">➕ নতুন পাতা</button>
            </div>

            <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-200">
                <input type="text" id="searchInput" onkeyup="renderNotes()" class="w-full px-3 py-2.5 text-sm bg-slate-50 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-slate-800 font-bold" placeholder="🔍 হিসাব খুঁজুন...">
            </div>

            <div id="notesList" class="space-y-3">
                <!-- নোট কার্ডগুলো এখানে আসবে -->
            </div>
        </div>

        <!-- এডিটর ভিউ: লেখার পাতা -->
        <div id="editorView" class="hidden flex-1 flex flex-col space-y-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
                <input type="text" id="noteTitleInput" oninput="autoSave()" placeholder="নাম লিখুন (যেমন: রহিম)" class="w-2/3 text-base font-bold text-slate-900 bg-slate-50 px-3.5 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition">
                <div id="pageTotalBadge" class="bg-indigo-50 text-indigo-700 text-sm font-extrabold px-3.5 py-1.5 rounded-full border border-indigo-100 shadow-sm">
                    মোট: ৳০
                </div>
            </div>
            
            <textarea id="noteContentInput" oninput="autoSave()" placeholder="এখানে পাশাপাশি বা ইচ্ছামমতো লিখুন..." class="note-page w-full flex-1 p-1 focus:outline-none"></textarea>
        </div>

    </main>

    <!-- Script -->
    <script>
        const STORAGE_KEY_1 = 'my_permanent_hd_notes_v7';
        const STORAGE_KEY_BACKUP = 'my_permanent_hd_notes_backup_v7';

        let notes = loadPersistentNotes();
        let currentNoteId = null;
        let saveTimeout = null;

        const homeView = document.getElementById('homeView');
        const editorView = document.getElementById('editorView');
        const notesListDiv = document.getElementById('notesList');
        const noteTitleInput = document.getElementById('noteTitleInput');
        const noteContentInput = document.getElementById('noteContentInput');
        const saveStatus = document.getElementById('saveStatus');
        const searchInput = document.getElementById('searchInput');
        const pageTotalBadge = document.getElementById('pageTotalBadge');

        function loadPersistentNotes() {
            try {
                let data1 = localStorage.getItem(STORAGE_KEY_1);
                let dataBackup = localStorage.getItem(STORAGE_KEY_BACKUP);
                if (data1) return JSON.parse(data1);
                else if (dataBackup) return JSON.parse(dataBackup);
            } catch (e) {
                console.error("ডেটা লোড করতে সমস্যা হয়েছে", e);
            }
            return [];
        }

        function savePersistentNotes() {
            try {
                const jsonData = JSON.stringify(notes);
                localStorage.setItem(STORAGE_KEY_1, jsonData);
                localStorage.setItem(STORAGE_KEY_BACKUP, jsonData);
            } catch (e) {
                console.error("ডেটা সেভ করতে সমস্যা হয়েছে", e);
            }
        }

        function calculateTotal(content) {
            if (!content) return 0;
            const numbers = content.match(/-?\d+(\.\d+)?/g);
            if (!numbers) return 0;
            return numbers.reduce((sum, num) => sum + parseFloat(num), 0);
        }

        function createNewNote() {
            const newNote = {
                id: Date.now(),
                title: 'নতুন হিসাবের পাতা',
                content: '',
                date: new Date().toLocaleDateString('bn-BD')
            };
            notes.unshift(newNote);
            savePersistentNotes();
            openEditor(newNote.id);
        }

        function renderNotes() {
            const searchText = searchInput.value.toLowerCase();
            notesListDiv.innerHTML = '';
            const filtered = notes.filter(n => n.title.toLowerCase().includes(searchText) || n.content.toLowerCase().includes(searchText));

            if (filtered.length === 0) {
                notesListDiv.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-xs text-slate-400 border border-slate-200 shadow-sm">কোনো পাতা নেই। নতুন পাতা খুলে লেখাগুলো সাজিয়ে রাখুন।</div>`;
                return;
            }

            filtered.forEach(note => {
                let totalAmount = calculateTotal(note.content);
                const card = document.createElement('div');
                card.className = "note-card bg-white p-4.5 rounded-2xl shadow-sm border border-slate-200 cursor-pointer relative select-none";
                
                card.onclick = () => openEditor(note.id);

                let pressTimer;
                card.addEventListener('touchstart', (e) => {
                    pressTimer = setTimeout(() => {
                        triggerDelete(note.id, note.title);
                    }, 600);
                });

                card.addEventListener('touchend', () => { clearTimeout(pressTimer); });
                card.addEventListener('touchmove', () => { clearTimeout(pressTimer); });

                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    triggerDelete(note.id, note.title);
                });

                card.innerHTML = `
                    <div class="absolute top-4 right-4 bg-indigo-50 text-indigo-800 text-sm font-extrabold px-3 py-1 rounded-full border border-indigo-200 shadow-sm">
                        মোট: ৳${totalAmount}
                    </div>
                    <div class="space-y-2 overflow-hidden pr-24">
                        <h3 class="font-bold text-slate-900 text-base tracking-wide truncate">${note.title}</h3>
                        <p class="text-sm text-slate-800 line-clamp-2 leading-relaxed font-bold">${note.content || 'খালি পাতা...'}</p>
                        <span class="text-xs text-slate-500 font-bold block pt-1">${note.date}</span>
                    </div>
                `;
                notesListDiv.appendChild(card);
            });
        }

        function triggerDelete(id, title) {
            if (confirm(`"${title}" পাতাটি পাকাপাকিভাবে মুছে ফেলতে চান?`)) {
                notes = notes.filter(n => n.id !== id);
                savePersistentNotes();
                renderNotes();
            }
        }

        function openEditor(id) {
            currentNoteId = id;
            const note = notes.find(n => n.id === id);
            if (!note) return;

            homeView.classList.add('hidden');
            editorView.classList.remove('hidden');

            noteTitleInput.value = note.title;
            noteContentInput.value = note.content;
            document.getElementById('pageTitle').innerText = note.title;
            updateHeaderTotal(note.content);
            saveStatus.innerText = '';
        }

        function goHome() {
            currentNoteId = null;
            editorView.classList.add('hidden');
            homeView.classList.remove('hidden');
            renderNotes();
        }

        function updateHeaderTotal(content) {
            let total = calculateTotal(content);
            pageTotalBadge.innerText = `মোট: ৳${total}`;
        }

        function autoSave() {
            saveStatus.innerText = 'সেভ হচ্ছে...';
            clearTimeout(saveTimeout);

            const currentText = noteContentInput.value;
            updateHeaderTotal(currentText);

            saveTimeout = setTimeout(() => {
                const note = notes.find(n => n.id === currentNoteId);
                if (note) {
                    note.title = noteTitleInput.value.trim() || 'নামবিহীন পাতা';
                    note.content = currentText;
                    document.getElementById('pageTitle').innerText = note.title;
                    savePersistentNotes();
                    saveStatus.innerText = 'সেভ হয়েছে ✓';
                    setTimeout(() => { saveStatus.innerText = ''; }, 1500);
                }
            }, 300);
        }

        renderNotes();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('Service Worker Failed', err));
            });
        }
    </script>
</body>
</html>
