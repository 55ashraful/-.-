    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQIMrolJFKQqJ-iX_c-0nMas_6rszWFD0",
            authDomain: "digital-khata-126be.firebaseapp.com",
            projectId: "digital-khata-126be",
            storageBucket: "digital-khata-126be.firebasestorage.app",
            messagingSenderId: "42333578545",
            appId: "1:42333578545:web:144f110b9a2fcef9033c10",
            measurementId: "G-0WYCE8G4R1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // লোকাল ও ক্লাউড ডাটা একত্র (মার্জ) করার ফাংশন
        function mergeLists(localList, cloudList) {
            const map = new Map();
            const add = (item) => {
                if (!item || item.id === undefined) return;
                const key = String(item.id);
                const existing = map.get(key);
                if (!existing) {
                    map.set(key, item);
                } else {
                    const tNew = item.updatedAt || 0;
                    const tOld = existing.updatedAt || 0;
                    map.set(key, (tNew >= tOld) ? item : existing);
                }
            };
            (cloudList || []).forEach(add);
            (localList || []).forEach(add);
            return Array.from(map.values()).sort((a, b) => (b.updatedAt || b.id) - (a.updatedAt || a.id));
        }

        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider).catch((error) => {
                console.error("লগইন ত্রুটি:", error);
                if (!navigator.onLine || error.code === 'auth/internal-error' || error.code === 'auth/network-request-failed') {
                    alert("এই অ্যাপ ব্যবহার করতে হলে প্রথমবার ইন্টারনেট কানেক্ট করে Google দিয়ে রেজিস্ট্রেশন করতে হবে।");
                } else {
                    alert("লগইন করতে সমস্যা হয়েছে: " + error.message);
                }
            });
        };

        window.logoutApp = function() {
            if (confirm("আপনি কি একাউন্ট থেকে বের হতে চান?")) {
                signOut(auth).then(() => {
                    localStorage.clear();
                    location.reload();
                });
            }
        };

        onAuthStateChanged(auth, async (user) => {
            const loginView = document.getElementById('loginView');
            const mainAppView = document.getElementById('mainAppView');
            const userEmailSpan = document.getElementById('userEmailSpan');

            if (user) {
                loginView.classList.add('hidden');
                mainAppView.classList.remove('hidden');
                userEmailSpan.innerText = user.email;

                // ইন্টারনেট থাকলে ক্লাউড ডাটা আনবো, রিপ্লেস না করে মার্জ করবো
                if (navigator.onLine) {
                    try {
                        const docRef = doc(db, "users_khata", user.uid);
                        const docSnap = await getDoc(docRef);

                        let cloudNotes = [];
                        let cloudTrash = [];
                        if (docSnap.exists()) {
                            cloudNotes = docSnap.data().notes || [];
                            cloudTrash = docSnap.data().trashNotes || [];
                        }

                        notes = mergeLists(notes, cloudNotes);
                        trashNotes = mergeLists(trashNotes, cloudTrash);

                        localStorage.setItem(STORAGE_KEY_1, JSON.stringify(notes));
                        localStorage.setItem(STORAGE_KEY_TRASH, JSON.stringify(trashNotes));

                        await window.syncToCloud();
                    } catch (e) {
                        console.log("ক্লাউড থেকে ডাটা আনতে সমস্যা:", e);
                    }
                }
                renderNotes();

                // ✅ নতুন: হোম স্ক্রিন শর্টকাটের অ্যাকশন হ্যান্ডেল
                const urlParams = new URLSearchParams(window.location.search);
                const shortcutAction = urlParams.get('action');
                if (shortcutAction) {
                    window.history.replaceState(null, '', './index.html');
                    setTimeout(() => {
                        if (shortcutAction === 'new' && typeof createNewNote === 'function') {
                            createNewNote();
                        } else if (shortcutAction === 'history' && typeof openHistory === 'function') {
                            openHistory();
                        }
                    }, 800);
                }
            } else {
                mainAppView.classList.add('hidden');
                loginView.classList.remove('hidden');
            }
        });

        window.syncToCloud = async function() {
            const user = auth.currentUser;
            if (user && navigator.onLine) {
                try {
                    await setDoc(doc(db, "users_khata", user.uid), {
                        notes: notes,
                        trashNotes: trashNotes,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                } catch (e) {
                    console.error("ক্লাউড সিংক ব্যর্থ:", e);
                }
            }
        };

        // ইন্টারনেট ফিরে এলেই রিলোড ছাড়াই অটো সিংক
        window.addEventListener('online', () => {
            setTimeout(() => { window.syncToCloud(); }, 3000);
        });
    </script>
</head>

            <h2 style="font-size: 20px; font-weight: bold; color: #0f172a; margin-bottom: 8px;">📖 স্থায়ী ডিজিটাল খাতা</h2>
            <p style="font-size: 12px; color: #64748b; margin-bottom: 24px;">দোকানের হিসাব নিরাপদ রাখতে আপনার জিমেইল দিয়ে প্রবেশ করুন। ফোন নষ্ট হলেও হিসাব হারাবে না!</p>

            <div id="homeView">

                    <div>
                        <h2 style="font-size: 13px; font-weight: bold; color: #1e293b;" id="userEmailSpan"></h2>

                <textarea id="noteContentInput" oninput="autoSave()" placeholder="এখানে পাশাপাশি বা ইচ্ছামমতো লিখুন..." class="note-page"></textarea>

    <script>
        const STORAGE_KEY_1 = 'my_permanent_hd_notes_v11';
        const STORAGE_KEY_TRASH = 'my_permanent_hd_trash_v11';

        let notes = JSON.parse(localStorage.getItem(STORAGE_KEY_1)) || [];
        let trashNotes = JSON.parse(localStorage.getItem(STORAGE_KEY_TRASH)) || [];

        let currentNoteId = null;
        let saveTimeout = null;

        const homeView = document.getElementById('homeView');
        const historyView = document.getElementById('historyView');
        const editorView = document.getElementById('editorView');

        const notesListDiv = document.getElementById('notesList');
        const historyListDiv = document.getElementById('historyList');
        const historyCountBadge = document.getElementById('historyCountBadge');

        const noteTitleInput = document.getElementById('noteTitleInput');
        const noteContentInput = document.getElementById('noteContentInput');
        const saveStatus = document.getElementById('saveStatus');
        const searchInput = document.getElementById('searchInput');
        const pageTotalBadge = document.getElementById('pageTotalBadge');

        function saveAll() {
            try {
                localStorage.setItem(STORAGE_KEY_1, JSON.stringify(notes));
                localStorage.setItem(STORAGE_KEY_TRASH, JSON.stringify(trashNotes));
                if (typeof window.syncToCloud === 'function') {
                    window.syncToCloud();
                }
            } catch (e) {
                console.error("সেভ করতে সমস্যা", e);
            }
            updateHistoryBadge();
        }

        function updateHistoryBadge() {
            historyCountBadge.innerText = trashNotes.length;
        }

        function calculateTotal(content) {
            if (!content) return 0;
            const numbers = content.match(/-?\d+(\.\d+)?/g);
            if (!numbers) return 0;
            return numbers.reduce((sum, num) => sum + parseFloat(num), 0);
        }

        function createNewNote() {
            const newNote = {
                id: Date.now(),
                title: 'নতুন হিসাবের পাতা',
                content: '',
                date: new Date().toLocaleDateString('bn-BD'),
                updatedAt: Date.now()
            };
            notes.unshift(newNote);
            saveAll();
            openEditor(newNote.id);
        }

        function renderNotes() {
            const searchText = searchInput.value.toLowerCase();
            notesListDiv.innerHTML = '';
            const filtered = notes.filter(n => n.title.toLowerCase().includes(searchText) || n.content.toLowerCase().includes(searchText));

            if (filtered.length === 0) {
                notesListDiv.innerHTML = `<div class="card text-center">কোনো পাতা নেই। নতুন পাতা খুলে লেখা শুরু করুন।</div>`;
                return;
            }

            filtered.forEach(note => {
                let totalAmount = calculateTotal(note.content);
                const card = document.createElement('div');
                card.className = "note-card";

                let isLongPress = false;
                let pressTimer;

                card.onclick = () => {
                    if (!isLongPress) {
                        openEditor(note.id);
                    }
                };

                const startPress = (e) => {
                    isLongPress = false;
                    clearTimeout(pressTimer);
                    pressTimer = setTimeout(() => {
                        isLongPress = true;
                        moveToTrashDirect(note.id, note.title);
                    }, 3000);
                };

                const cancelPress = () => {
                    clearTimeout(pressTimer);
                };

                card.addEventListener('touchstart', startPress, {passive: true});
                card.addEventListener('touchend', cancelPress);
                card.addEventListener('touchmove', cancelPress);
                card.addEventListener('mousedown', startPress);
                card.addEventListener('mouseup', cancelPress);
                card.addEventListener('mouseleave', cancelPress);

                card.innerHTML = `
                    <div class="amount-tag">মোট: ৳${totalAmount}</div>
                    <div>
                        <div class="note-title">${note.title}</div>
                        <div class="note-snippet">${note.content || 'খালি পাতা...'}</div>
                        <div class="note-date">${note.date}</div>
                    </div>
                `;
                notesListDiv.appendChild(card);
            });
            updateHistoryBadge();
        }

        function moveToTrashDirect(id, title) {
            const noteIndex = notes.findIndex(n => n.id === id);
            if (noteIndex > -1) {
                const removedNote = notes.splice(noteIndex, 1)[0];
                removedNote.updatedAt = Date.now();
                trashNotes.unshift(removedNote);
                saveAll();
                renderNotes();
                alert(`"${title}" সফলভাবে ডিলিট করা হয়েছে।`);
            }
        }

        function openHistory() {
            homeView.classList.add('hidden');
            editorView.classList.add('hidden');
            historyView.classList.remove('hidden');
            document.getElementById('pageTitle').innerText = 'হিস্টোরি';
            renderHistory();
        }

        function renderHistory() {
            historyListDiv.innerHTML = '';
            if (trashNotes.length === 0) {
                historyListDiv.innerHTML = `<div class="card text-center">হিস্টোরি একদম খালি।</div>`;
                return;
            }

            trashNotes.forEach(note => {
                let totalAmount = calculateTotal(note.content);
                const card = document.createElement('div');
                card.className = "note-card";
                card.style.borderColor = '#fca5a5';

                card.innerHTML = `
                    <div class="amount-tag" style="background-color: #ffe4e6; color: #9f1239; border-color: #fecdd3;">মোট: ৳${totalAmount}</div>
                    <div style="margin-bottom: 10px;">
                        <div class="note-title">${note.title}</div>
                        <div class="note-snippet">${note.content || 'খালি পাতা...'}</div>
                        <div class="note-date">${note.date}</div>
                    </div>
                    <div class="history-card-btns">
                        <button onclick="restoreNote(${note.id})" class="restore-btn">🔄 ফিরিয়ে আনুন</button>
                        <button onclick="permanentDelete(${note.id})" class="perm-del-btn">🗑️ চিরতরে মুছুন</button>
                    </div>
                `;
                historyListDiv.appendChild(card);
            });
        }

        function restoreNote(id) {
            const index = trashNotes.findIndex(n => n.id === id);
            if (index > -1) {
                const restored = trashNotes.splice(index, 1)[0];
                restored.updatedAt = Date.now();
                notes.unshift(restored);
                saveAll();
                renderHistory();
            }
        }

        function permanentDelete(id) {
            if (confirm("এই হিসাবটি পাকাপাকিভাবে মুছে ফেলতে চান? এটি আর কখনোই ফিরিয়ে আনা যাবে না!")) {
                trashNotes = trashNotes.filter(n => n.id !== id);
                saveAll();
                renderHistory();
            }
        }

        function openEditor(id) {
            currentNoteId = id;
            const note = notes.find(n => n.id === id);
            if (!note) return;

            homeView.classList.add('hidden');
            historyView.classList.add('hidden');
            editorView.classList.remove('hidden');

            noteTitleInput.value = note.title;
            noteContentInput.value = note.content;
            document.getElementById('pageTitle').innerText = note.title;
            updateHeaderTotal(note.content);
            saveStatus.innerText = '';
        }

        function goHome() {
            currentNoteId = null;
            editorView.classList.add('hidden');
            historyView.classList.add('hidden');
            homeView.classList.remove('hidden');
            document.getElementById('pageTitle').innerText = 'স্থায়ী খাতা';
            renderNotes();
        }

        function updateHeaderTotal(content) {
            let total = calculateTotal(content);
            pageTotalBadge.innerText = `মোট: ৳${total}`;
        }

        function autoSave() {
            saveStatus.innerText = 'সেভ হচ্ছে...';
            clearTimeout(saveTimeout);

            const currentText = noteContentInput.value;
            updateHeaderTotal(currentText);

            saveTimeout = setTimeout(() => {
                const note = notes.find(n => n.id === currentNoteId);
                if (note) {
                    note.title = noteTitleInput.value.trim() || 'নামবিহীন পাতা';
                    note.content = currentText;
                    note.updatedAt = Date.now();
                    document.getElementById('pageTitle').innerText = note.title;
                    saveAll();
                    saveStatus.innerText = 'সেভ হয়েছে ✓';
                    setTimeout(() => { saveStatus.innerText = ''; }, 1500);
                }
            }, 300);
        }
    </script>
</body>
</html>
